version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: helping-hand-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: helping_hand_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Auto-runs on first container start: creates tables + seeds all 34 services
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: helping-hand-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: helping_hand_db
      DB_USER: root
      DB_PASSWORD: rootpass123
      # Chatbot needs this — get a free key from https://console.groq.com/keys
      # then either put it here directly, or run:
      #   GROQ_API_KEY=your_key_here docker compose up --build
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8080:8080"

volumes:
  db_data:
